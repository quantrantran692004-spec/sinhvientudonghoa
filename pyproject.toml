[project]
name = "amazon-android-tool"
version = "0.1.0"
description = "Real-device Android and Amazon Shopping setup controller"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8", "pywinauto>=0.6.9,<0.7", "customtkinter>=5.2,<6", "playwright>=1.50,<2"]

[project.scripts]
amazon-android = "amazon_android.cli:main"
amazon-swarmote-desktop = "amazon_android.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
amazon_android = ["assets/*.png"]
